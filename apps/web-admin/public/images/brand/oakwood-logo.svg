<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006A3B" />
      <stop offset="60%" stop-color="#004D2A" />
      <stop offset="100%" stop-color="#01331C" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE588" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#002412" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Circle with Shadow -->
  <circle cx="80" cy="80" r="76" fill="url(#bgGrad)" filter="url(#badgeShadow)" stroke="url(#goldGrad)" stroke-width="3" />

  <!-- Inner Concentric Ring -->
  <circle cx="80" cy="80" r="69" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="2.5 2" opacity="0.85" />
  <circle cx="80" cy="80" r="63" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.35" />

  <!-- Laurel Wreath Leaves (Left) -->
  <g fill="url(#goldGrad)" opacity="0.9">
    <path d="M42 98c-3-6-4-13-2-20 3 4 5 10 2 20z" />
    <path d="M37 83c-4-5-5-12-3-18 4 3 6 9 3 18z" />
    <path d="M36 67c-3-6-3-13 0-19 4 3 5 9 0 19z" />
    <path d="M40 52c-2-6-1-12 3-17 3 4 3 10-3 17z" />
    <path d="M48 39c-1-5 1-11 6-15 2 4 1 10-6 15z" />
  </g>

  <!-- Laurel Wreath Leaves (Right) -->
  <g fill="url(#goldGrad)" opacity="0.9">
    <path d="M118 98c3-6 4-13 2-20-3 4-5 10-2 20z" />
    <path d="M123 83c4-5 5-12 3-18-4 3-6 9-3 18z" />
    <path d="M124 67c3-6 3-13 0-19-4 3-5 9 0 19z" />
    <path d="M120 52c2-6 1-12-3-17-3 4-3 10 3 17z" />
    <path d="M112 39c1-5-1-11-6-15-2 4-1 10 6 15z" />
  </g>

  <!-- Crossed Golf Clubs Behind Tree -->
  <g stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round">
    <!-- Club 1 (Diagonal Left-to-Right) -->
    <line x1="48" y1="116" x2="112" y2="52" opacity="0.75" />
    <!-- Iron Head 1 -->
    <path d="M112 52l5-5c1.5-1.5 4-.5 4.5 1.5l.5 2.5c.3 1.5-.5 3-2 3.5l-8 2.5z" fill="url(#goldGrad)" stroke="none" opacity="0.85" />

    <!-- Club 2 (Diagonal Right-to-Left) -->
    <line x1="112" y1="116" x2="48" y2="52" opacity="0.75" />
    <!-- Iron Head 2 -->
    <path d="M48 52l-5-5c-1.5-1.5-4-.5-4.5 1.5l-.5 2.5c-.3 1.5.5 3 2 3.5l8 2.5z" fill="url(#goldGrad)" stroke="none" opacity="0.85" />
  </g>

  <!-- Center Shield Backdrop -->
  <path d="M60 48h40c3 0 5 2 5 5v26c0 18-18 29-25 33-7-4-25-15-25-33V53c0-3 2-5 5-5z" fill="#003D20" stroke="url(#goldGrad)" stroke-width="1.5" />

  <!-- Oak Tree in Center Shield -->
  <!-- Tree Crown -->
  <g fill="#EAF7EE">
    <!-- Center top dome -->
    <circle cx="80" cy="62" r="10" />
    <!-- Left foliage lobes -->
    <circle cx="72" cy="66" r="8" />
    <circle cx="69" cy="74" r="7.5" />
    <!-- Right foliage lobes -->
    <circle cx="88" cy="66" r="8" />
    <circle cx="91" cy="74" r="7.5" />
    <!-- Center fullness -->
    <circle cx="80" cy="71" r="10.5" />
  </g>

  <!-- Tree Trunk & Roots -->
  <path d="M78 77h4v15h-4z" fill="url(#goldGrad)" />
  <path d="M76 92c2-2 3-5 3-8h2c0 3 1 6 3 8-1 1-3 1.5-4 1.5s-3-.5-4-1.5z" fill="url(#goldGrad)" />

  <!-- Golf Ball on Tee at Base of Shield -->
  <path d="M78 100l2 6h-1v4h2v-4h-1l2-6z" fill="url(#goldGrad)" />
  <circle cx="80" cy="98" r="3.2" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="0.8" />

  <!-- Upper Banner Text / Star Cluster -->
  <g fill="url(#goldGrad)">
    <polygon points="80,31 81.5,35 86,35 82.5,37.5 84,41.5 80,39 76,41.5 77.5,37.5 74,35 78.5,35" />
    <polygon points="68,34 69,36.5 72,36.5 69.5,38.2 70.5,41 68,39.2 65.5,41 66.5,38.2 64,36.5 67,36.5" transform="scale(0.8) translate(18, 5)" />
    <polygon points="92,34 93,36.5 96,36.5 93.5,38.2 94.5,41 92,39.2 89.5,41 90.5,38.2 88,36.5 91,36.5" transform="scale(0.8) translate(22, 5)" />
  </g>

  <!-- Lower Ribbon / Established Text -->
  <g>
    <!-- Ribbon Banner Background -->
    <path d="M52 124h56l6 8-6 8H52l-6-8 6-8z" fill="#00361C" stroke="url(#goldGrad)" stroke-width="1.2" />
    <!-- Ribbon Fishtail Ends -->
    <path d="M46 132l6-8v16l-6-8z" fill="url(#goldGrad)" opacity="0.6" />
    <path d="M114 132l-6-8v16l6-8z" fill="url(#goldGrad)" opacity="0.6" />
    <!-- Banner Typography -->
    <text x="80" y="136" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="800" fill="url(#goldGrad)" letter-spacing="1.2">EST. 1924</text>
  </g>
</svg>
